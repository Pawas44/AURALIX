name: Build Both (Android APK + iOS IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------
  # JOB 1: Build & Release Android APK Immediately
  # ------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug -PversionCode=${{ github.run_number }} -PversionName=1.0.${{ github.run_number }} --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoGuard-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Publish Android APK Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          APK_FILE=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_FILE" AURALIX.apk
          ls -lh AURALIX.apk

          {
            echo "### 🚀 What's New in AURALIX $TAG"
            echo "- **👥 Listen Together (Live Jam)**: Real-time collaborative listening with friends! Join or host a jam session directly from the player or account sheet."
            echo "- **⚡ Seamless In-Place APK Upgrades**: Built with permanent cryptographic keystore signing and monotonically increasing version codes. No more 'App not installed' errors when upgrading!"
            echo "- **🔄 Auto In-App Update Engine**: Automatic update prompt with one-click background download, real-time progress indicator, and in-place package installation."
            echo "- **☕ Authentic Buy Me a Coffee & UPI Support**: Official coral orange BMC widget button and native UPI app chooser with direct deep links."
            echo "- **📱 Smooth Swipe-Down Player Gesture**: High-priority vertical drag gesture to seamlessly minimize the full-screen music player."
            echo "- **🧠 Spotify-Level Intelligent Music Recommendation Engine**: Integrated local-first adaptive recommendation system including **Made For You**, **Discover Weekly** (~30 songs, 40% familiar + 60% discovery, weekly auto-refresh), **Daily Mixes (Mix 1-5)**, **Because You Listened To**, **Your Most Played**, **Continue Listening**, and **Hidden Gems** with cross-section deduplication."
            echo "- **🎤 Real-Time Spotify-Style Synchronized Lyrics (Android & iOS)**: Smooth luminous line highlighting, tap-to-seek playback, manual drag detection with floating 'Sync' snap back, LRCLIB integration with smart multi-source fallback, persistent disk caching, and timing offset fine-tuning."
            echo "- **📊 Dynamic Music Taste Profile**: Real-time behavioral tracking (completed songs, replays, skips, likes, playlist additions) with weighted scoring formulas and local persistence."
            echo "- **🔍 Music Discovery Interactions**: Interactive 'Why am I seeing this song?' transparent explanation sheet, 'Start radio (More like this)', and 'Not interested / Hide this song' dynamic filtering."
            echo "- **🟢 Spotify Link-Only Music Importer**: Clean, instant Spotify playlist link importer that enriches user taste profile."
            echo "- **🏷️ Clean Song Metadata for Downloads**: YouTube oEmbed auto-healing resolves real song titles and artist names, eliminating 'YouTube Video (videoId)' placeholders."
            echo "- **⬇️ Resilient Download Engine**: Multi-client InnerTube pipeline (ANDROID format 18 + IOS AAC m4a) with full CDN streaming headers."
            echo "- **⚡ Smooth Performance & Playback**: Asynchronous background computation on Dispatchers.IO, recommendation caching with TTL, and non-blocking playback."
            echo ""
            echo "### 📥 Direct Downloads"
            echo "- [AURALIX.apk (Android)](https://github.com/${{ github.repository }}/releases/download/$TAG/AURALIX.apk)"
            echo "- [AURALIX.ipa (iOS)](https://github.com/${{ github.repository }}/releases/download/$TAG/AURALIX.ipa)"
          } > release_notes.md

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $TAG exists. Uploading AURALIX.apk..."
            gh release upload "$TAG" AURALIX.apk --clobber --repo "${{ github.repository }}"
          else
            echo "Creating release $TAG with AURALIX.apk..."
            gh release create "$TAG" AURALIX.apk \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "AURALIX $TAG" \
              --notes-file release_notes.md \
              --latest
          fi
          echo "Android APK released successfully!"

  # ------------------------------------------------------------
  # JOB 2: Build iOS IPA & Upload to Release
  # ------------------------------------------------------------
  build-ios:
    name: Build iOS IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(find /Applications -name "Xcode*.app" -maxdepth 1 | sort -V | tail -n 1)
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Build VideoGuard iOS App
        run: |
          cd ios
          xcodebuild -project VideoGuard.xcodeproj \
            -scheme VideoGuard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package Payload into IPA
        run: |
          cd ios
          APP_PATH=$(find ./DerivedData -name "VideoGuard.app" -type d | head -n 1)
          echo "Found App at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r VideoGuard.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoGuard-iOS-IPA
          path: ios/VideoGuard.ipa

      - name: Publish iOS IPA to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          cp ios/VideoGuard.ipa AURALIX.ipa

          for i in {1..30}; do
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              echo "Release $TAG found! Uploading AURALIX.ipa..."
              gh release upload "$TAG" AURALIX.ipa --clobber --repo "${{ github.repository }}"
              echo "Uploaded AURALIX.ipa successfully!"
              exit 0
            fi
            echo "Release $TAG not found yet. Retrying in 10s... ($i/30)"
            sleep 10
          done

          echo "Creating release $TAG with AURALIX.ipa..."
          gh release create "$TAG" AURALIX.ipa \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "AURALIX $TAG" \
            --latest
