name: Build Both (Android APK + iOS IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------
  # JOB 1: Build Android APK
  # ------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoGuard-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk

  # ------------------------------------------------------------
  # JOB 2: Build iOS IPA
  # ------------------------------------------------------------
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(find /Applications -name "Xcode*.app" -maxdepth 1 | sort -V | tail -n 1)
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Build VideoGuard iOS App
        run: |
          cd ios
          xcodebuild -project VideoGuard.xcodeproj \
            -scheme VideoGuard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package Payload into IPA
        run: |
          cd ios
          APP_PATH=$(find ./DerivedData -name "VideoGuard.app" -type d | head -n 1)
          echo "Found App at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r VideoGuard.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoGuard-iOS-IPA
          path: ios/VideoGuard.ipa

  # ------------------------------------------------------------
  # JOB 3: Create GitHub Release with Direct Downloads
  # ------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest

    steps:
      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: VideoGuard-Android-APK
          path: release-assets

      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: VideoGuard-iOS-IPA
          path: release-assets

      - name: Prepare Release Assets
        run: |
          ls -la release-assets
          APK_FILE=$(find release-assets -name "*.apk" | head -n 1)
          IPA_FILE=$(find release-assets -name "*.ipa" | head -n 1)
          mv "$APK_FILE" release-assets/AURALIX.apk
          mv "$IPA_FILE" release-assets/AURALIX.ipa
          ls -lh release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          cat << 'EOF' > release_notes.md
### 🚀 What's New in AURALIX __TAG__
- **➕ Library Screen & New Playlist Option**: Added '+' New Playlist button and creation modal in Library on Android & iOS for quick playlist management.
- **⚡ Amazon Music & Spotify 115+ Tracks Import**: Full-fidelity playlist sync supporting 115+ tracks with high-speed concurrent batch matching, multi-region Amazon Music links (.com, .in, amzn.to), JSON-LD schema parsing, and clipboard text import.
- **📻 Smart Recommendations & Infinite Queue**: Dynamic recommendation carousel on Home Feed with auto-queue radio playback.
- **🍏 iOS Music Player Overhaul**: Safe-area notch padding, visible top collapse chevron, dynamic scaling album art, liquid red scrubber, and swipe-down-to-dismiss.

### 📥 Direct Downloads
- [AURALIX.apk (Android)](https://github.com/__REPO__/releases/download/__TAG__/AURALIX.apk)
- [AURALIX.ipa (iOS)](https://github.com/__REPO__/releases/download/__TAG__/AURALIX.ipa)
EOF
          sed -i "s|__TAG__|$TAG|g" release_notes.md
          sed -i "s|__REPO__|${{ github.repository }}|g" release_notes.md

          gh release create "$TAG" \
            release-assets/AURALIX.apk \
            release-assets/AURALIX.ipa \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "AURALIX $TAG" \
            --notes-file release_notes.md \
            --latest
