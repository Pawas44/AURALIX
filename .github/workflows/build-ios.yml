name: Build Both (Android APK + iOS IPA)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------
  # JOB 1: Build Android APK
  # ------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoGuard-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk

  # ------------------------------------------------------------
  # JOB 2: Build iOS IPA
  # ------------------------------------------------------------
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(find /Applications -name "Xcode*.app" -maxdepth 1 | sort -V | tail -n 1)
          echo "Selecting $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Build VideoGuard iOS App
        run: |
          cd ios
          xcodebuild -project VideoGuard.xcodeproj \
            -scheme VideoGuard \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ./DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build

      - name: Package Payload into IPA
        run: |
          cd ios
          APP_PATH=$(find ./DerivedData -name "VideoGuard.app" -type d | head -n 1)
          echo "Found App at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r VideoGuard.ipa Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoGuard-iOS-IPA
          path: ios/VideoGuard.ipa

  # ------------------------------------------------------------
  # JOB 3: Create GitHub Release with Direct Downloads
  # ------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest

    steps:
      - name: Download Android APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: VideoGuard-Android-APK
          path: release-assets

      - name: Download iOS IPA Artifact
        uses: actions/download-artifact@v4
        with:
          name: VideoGuard-iOS-IPA
          path: release-assets

      - name: Prepare Release Assets
        run: |
          ls -la release-assets
          APK_FILE=$(find release-assets -name "*.apk" | head -n 1)
          IPA_FILE=$(find release-assets -name "*.ipa" | head -n 1)
          mv "$APK_FILE" release-assets/AURALIX.apk
          mv "$IPA_FILE" release-assets/AURALIX.ipa
          ls -lh release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          {
            echo "### 🚀 What's New in AURALIX $TAG"
            echo "- **🧠 Spotify-Level Intelligent Music Recommendation Engine**: Integrated local-first adaptive recommendation system including **Made For You**, **Discover Weekly** (~30 songs, 40% familiar + 60% discovery, weekly auto-refresh), **Daily Mixes (Mix 1-5)**, **Because You Listened To**, **Your Most Played**, **Continue Listening**, and **Hidden Gems** with cross-section deduplication."
            echo "- **📊 Dynamic Music Taste Profile**: Real-time behavioral tracking (completed songs, replays, skips, likes, playlist additions) with weighted scoring formulas and local persistence."
            echo "- **🔍 Music Discovery Interactions**: Interactive 'Why am I seeing this song?' transparent explanation sheet, 'Start radio (More like this)', and 'Not interested / Hide this song' dynamic filtering."
            echo "- **💳 Direct UPI & Razorpay Support**: Instant UPI payment integration supporting Google Pay, PhonePe, Paytm, and BHIM via \`https://razorpay.me/@pawas\` along with Buy Me a Coffee direct browser launch."
            echo "- **🟢 Spotify-Only Music Importer**: 1-click OAuth login, multi-page playlist sync (100+ songs), and link parser that enriches user taste profile."
            echo "- **⬇️ Resilient Download Engine**: Multi-client InnerTube pipeline (ANDROID format 18 + IOS AAC m4a) with full CDN streaming headers."
            echo "- **⚡ Smooth Performance & Playback**: Asynchronous background computation on Dispatchers.IO, recommendation caching with TTL, and non-blocking playback."
            echo ""
            echo "### 📥 Direct Downloads"
            echo "- [AURALIX.apk (Android)](https://github.com/${{ github.repository }}/releases/download/$TAG/AURALIX.apk)"
            echo "- [AURALIX.ipa (iOS)](https://github.com/${{ github.repository }}/releases/download/$TAG/AURALIX.ipa)"
          } > release_notes.md

          gh release create "$TAG" \
            release-assets/AURALIX.apk \
            release-assets/AURALIX.ipa \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "AURALIX $TAG" \
            --notes-file release_notes.md \
            --latest
