name: Build iOS App

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set Xcode version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

    - name: Build VideoGuard iOS App
      run: |
        cd VideoGuard
        xcodebuild -project VideoGuard.xcodeproj \
          -scheme VideoGuard \
          -configuration Release \
          -sdk iphoneos \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGNING_ALLOWED=NO \
          clean build

    - name: Package Payload into IPA
      run: |
        cd VideoGuard
        mkdir -p build/Payload
        cp -r build/Release-iphoneos/VideoGuard.app build/Payload/
        cd build
        zip -r VideoGuard.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VideoGuard-iOS-IPA
        path: VideoGuard/build/VideoGuard.ipa

