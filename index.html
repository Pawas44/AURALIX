<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VideoGuard">
  <title>VideoGuard</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f0f0f; color: #f1f1f1; overflow-x: hidden; padding-bottom: 90px; }
    
    /* Top Bar */
    .topbar { position: sticky; top: 0; background: #0f0f0f; z-index: 50; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #222; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 19px; }
    .brand-icon { color: #ff0000; font-size: 24px; }
    .actions { display: flex; gap: 14px; font-size: 18px; align-items: center; }
    .avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }

    /* Category Chips */
    .categories { display: flex; gap: 8px; overflow-x: auto; padding: 10px 14px; scrollbar-width: none; background: #0f0f0f; }
    .categories::-webkit-scrollbar { display: none; }
    .chip { padding: 6px 14px; border-radius: 8px; background: #272727; font-size: 13px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: 0.2s; }
    .chip.active { background: #f1f1f1; color: #0f0f0f; }

    /* Video List */
    .feed { padding: 10px 0; display: flex; flex-direction: column; gap: 20px; }
    .video-card { cursor: pointer; }
    .thumb-wrap { position: relative; width: 100%; aspect-ratio: 16/9; background: #1e1e1e; overflow: hidden; }
    .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; }
    .duration { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.8); padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; }
    .video-info { display: flex; gap: 12px; padding: 12px 14px; }
    .channel-pic { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; flex-shrink: 0; }
    .title { font-size: 14px; font-weight: 500; line-height: 1.3; margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { font-size: 12px; color: #aaa; }

    /* Bottom Player */
    .mini-player { position: fixed; bottom: 56px; left: 0; right: 0; height: 50px; background: #1e1e1e; border-top: 1px solid #333; display: none; align-items: center; justify-content: space-between; padding: 0 12px; z-index: 90; }
    .mini-track { display: flex; align-items: center; gap: 10px; flex: 1; overflow: hidden; }
    .mini-thumb { width: 40px; height: 40px; border-radius: 4px; object-fit: cover; }
    .mini-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Bottom Navigation */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 56px; background: #0f0f0f; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: #aaa; text-decoration: none; cursor: pointer; }
    .nav-item.active { color: #f1f1f1; font-weight: 600; }
    .nav-icon { font-size: 20px; }

    /* Modal / Detail View */
    .player-view { position: fixed; inset: 0; background: #0f0f0f; z-index: 200; display: none; flex-direction: column; overflow-y: auto; }
    .player-view.active { display: flex; }
    .close-btn { position: absolute; top: 16px; left: 16px; z-index: 20; background: rgba(0,0,0,0.5); width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; }
    .video-player { width: 100%; aspect-ratio: 16/9; background: #000; position: relative; }
    .video-player iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="topbar">
    <div class="brand">
      <span class="brand-icon">▶</span>
      <span>VideoGuard</span>
    </div>
    <div class="actions">
      <span>🔍</span>
      <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150" class="avatar" alt="Avatar">
    </div>
  </div>

  <!-- Categories -->
  <div class="categories" id="categoryContainer"></div>

  <!-- Feed -->
  <div class="feed" id="videoFeed"></div>

  <!-- Mini Player -->
  <div class="mini-player" id="miniPlayer" onclick="openPlayer()">
    <div class="mini-track">
      <img id="miniImg" class="mini-thumb" src="" alt="">
      <div>
        <div id="miniTitle" class="mini-title">Title</div>
        <div style="font-size: 11px; color:#aaa;" id="miniArtist">Artist</div>
      </div>
    </div>
    <div style="font-size: 20px; margin-right: 8px;">▶</div>
  </div>

  <!-- Full Player Modal -->
  <div class="player-view" id="playerModal">
    <div class="close-btn" onclick="closePlayer()">✕</div>
    <div class="video-player">
      <iframe id="ytFrame" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
    </div>
    <div style="padding: 16px;">
      <h2 id="modalTitle" style="font-size: 18px; font-weight: 600; margin-bottom: 6px;">Title</h2>
      <div style="font-size: 13px; color: #aaa;" id="modalMeta">Views & Details</div>
    </div>
  </div>

  <!-- Bottom Nav -->
  <div class="bottom-nav">
    <div class="nav-item active"><span class="nav-icon">🏠</span>Home</div>
    <div class="nav-item"><span class="nav-icon">⚡</span>Shorts</div>
    <div class="nav-item"><span class="nav-icon">📺</span>Subscriptions</div>
    <div class="nav-item"><span class="nav-icon">👤</span>You</div>
  </div>

  <script>
    const videos = [
      { id: "4NRXx6U8ABQ", title: "The Weeknd - Blinding Lights (Official Video)", channel: "The Weeknd", views: "820M views", duration: "4:20", thumb: "https://img.youtube.com/vi/4NRXx6U8ABQ/hqdefault.jpg", avatar: "https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=150", category: "Music" },
      { id: "dvgZkm1xWPE", title: "Coldplay - Viva La Vida (Official Video)", channel: "Coldplay", views: "860M views", duration: "4:03", thumb: "https://img.youtube.com/vi/dvgZkm1xWPE/hqdefault.jpg", avatar: "https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=150", category: "Music" },
      { id: "7wtfhZwyrcc", title: "Imagine Dragons - Believer (Official Music Video)", channel: "Imagine Dragons", views: "2.6B views", duration: "3:37", thumb: "https://img.youtube.com/vi/7wtfhZwyrcc/hqdefault.jpg", avatar: "https://images.unsplash.com/photo-1493225457124-a3eb161ffa5f?w=150", category: "Music" },
      { id: "BC19kwABFwc", title: "Dua Lipa - Levitating (Official Music Video)", channel: "Dua Lipa", views: "890M views", duration: "3:51", thumb: "https://img.youtube.com/vi/BC19kwABFwc/hqdefault.jpg", avatar: "https://images.unsplash.com/photo-1516450360452-9312f5e86fc7?w=150", category: "Music" },
      { id: "094y1Z2wpJg", title: "The Simplest Math Problem No One Can Solve - Collatz Conjecture", channel: "Veritasium", views: "41M views", duration: "22:08", thumb: "https://img.youtube.com/vi/094y1Z2wpJg/hqdefault.jpg", avatar: "https://images.unsplash.com/photo-1570295999919-56ceb5ecca61?w=150", category: "Podcasts" },
      { id: "JGwWNGJdvx8", title: "Ed Sheeran - Shape of You (Official Music Video)", channel: "Ed Sheeran", views: "6.2B views", duration: "4:23", thumb: "https://img.youtube.com/vi/JGwWNGJdvx8/hqdefault.jpg", avatar: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=150", category: "Trending" }
    ];

    const categories = ["All", "Music", "Podcasts", "Gaming", "News", "Tech", "Trending"];
    let currentCategory = "All";
    let activeVideo = null;

    function renderCategories() {
      const el = document.getElementById("categoryContainer");
      el.innerHTML = categories.map(cat => 
        `<div class="chip ${cat === currentCategory ? 'active' : ''}" onclick="filterCat('${cat}')">${cat}</div>`
      ).join('');
    }

    function filterCat(cat) {
      currentCategory = cat;
      renderCategories();
      renderFeed();
    }

    function renderFeed() {
      const feed = document.getElementById("videoFeed");
      const filtered = currentCategory === "All" ? videos : videos.filter(v => v.category === currentCategory);
      feed.innerHTML = filtered.map(v => `
        <div class="video-card" onclick="playVideo('${v.id}')">
          <div class="thumb-wrap">
            <img src="${v.thumb}" alt="">
            <span class="duration">${v.duration}</span>
          </div>
          <div class="video-info">
            <img src="${v.avatar}" class="channel-pic" alt="">
            <div>
              <div class="title">${v.title}</div>
              <div class="meta">${v.channel} • ${v.views}</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    function playVideo(id) {
      activeVideo = videos.find(v => v.id === id);
      document.getElementById("miniPlayer").style.display = "flex";
      document.getElementById("miniImg").src = activeVideo.thumb;
      document.getElementById("miniTitle").innerText = activeVideo.title;
      document.getElementById("miniArtist").innerText = activeVideo.channel;
      openPlayer();
    }

    function openPlayer() {
      if (!activeVideo) return;
      document.getElementById("ytFrame").src = `https://www.youtube.com/embed/${activeVideo.id}?autoplay=1`;
      document.getElementById("modalTitle").innerText = activeVideo.title;
      document.getElementById("modalMeta").innerText = `${activeVideo.channel} • ${activeVideo.views}`;
      document.getElementById("playerModal").classList.add("active");
    }

    function closePlayer() {
      document.getElementById("ytFrame").src = "";
      document.getElementById("playerModal").classList.remove("active");
    }

    renderCategories();
    renderFeed();
  </script>
</body>
</html>
